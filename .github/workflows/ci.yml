name: CI

on:
  push:

# Workflow only needs read access to repository contents.
permissions:
  contents: read

# If several commits are pushed quickly to the same feature branch,
# cancel the older CI run and test only the newest commit.
#
# Never cancel a main/production workflow once it has started.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ==========================================================================
  # BUILD AND TEST
  #
  # Runs on every push to every branch.
  # ==========================================================================
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Keep the application's existing Node.js version for now.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Assert generated embed pages are current
        run: npm run assert:embed-pages-current

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Assert public embeds stay isolated
        run: npm run assert:embed-isolation

      - name: Assert monetization stays off
        run: npm run assert:mon-off

      # The domain was registered before we owned it, and Google still held the
      # previous owner's WordPress site: /home/ indexed with no description,
      # blocked by a robots.txt that stopped the crawler ever seeing the 301
      # waiting for it. Every cause was visible in dist/ and nothing was looking.
      - name: Assert the bundle is indexable
        run: npm run assert:indexable

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

  # ==========================================================================
  # DEPLOY TO HOSTINGER
  #
  # Runs ONLY when:
  #   1. build-and-test succeeds
  #   2. the push is on main
  #
  # Required repository secrets:
  #   HOSTINGER_HOST
  #   HOSTINGER_USER
  #   HOSTINGER_PORT
  #   HOSTINGER_PATH
  #   HOSTINGER_SSH_KEY
  # ==========================================================================
  deploy:
    needs: build-and-test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-24.04

    # Only one production deployment can run at a time.
    concurrency:
      group: hostinger-production
      cancel-in-progress: false

    # Job-level, because a step's own `env:` is not in scope for that step's
    # `if:` — declaring it per step would make every IndexNow guard read as
    # empty and silently skip. Absent secret => empty string => steps skip,
    # which is the intended behaviour for a fork or a repo without the key.
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      # Internal demo routes are used during development/tests,
      # but must never reach production.
      - name: Strip internal /dev routes from the bundle
        run: rm -rf dist/dev

      - name: Assert no /dev output is about to ship
        run: npm run assert:no-dev

      # Re-run on the exact bundle about to be uploaded, not just the one CI
      # built. This supersedes the bare `test -f dist/.htaccess` that used to sit
      # here: it still fails when the file is missing, and also when the file is
      # present but has lost the /home redirect or the DirectoryIndex pin, when
      # robots.txt blocks a path .htaccess redirects, or when the home page has
      # lost its canonical or description.
      - name: Assert the bundle is indexable
        run: npm run assert:indexable

      # ----------------------------------------------------------------------
      # INDEXNOW — PREPARE (must happen BEFORE the upload)
      # ----------------------------------------------------------------------
      # The ownership-proof file is written into the bundle here rather than
      # committed to `public/`, because the key is a secret: a key in a public
      # repository is a key anyone can submit URLs with.
      - name: Write the IndexNow key file into the bundle
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: npm run indexnow:key-file

      # Capture the sitemap that is CURRENTLY live, before rsync overwrites it.
      # Diffing it against the one just built is what makes the submission after
      # the deploy only the URLs that actually changed — re-submitting all 112
      # on every deploy is what gets a host throttled and ignored.
      - name: Capture the live sitemap as an IndexNow baseline
        if: ${{ env.INDEXNOW_KEY != '' }}
        continue-on-error: true
        run: |
          curl -fsS --max-time 30 \
            https://bestcalculate.com/sitemap-0.xml \
            -o /tmp/live-sitemap.xml \
          && echo "Baseline captured." \
          || echo "No live sitemap reachable — the submission step will be skipped."

      # ----------------------------------------------------------------------
      # SSH CONFIGURATION
      # ----------------------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # ----------------------------------------------------------------------
      # VERIFY HOSTINGER CONNECTION
      # ----------------------------------------------------------------------
      - name: Verify Hostinger SSH connection
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o PasswordAuthentication=no \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "test -d '$HOSTINGER_PATH' && echo 'SSH connection and deployment path verified'"

      # ----------------------------------------------------------------------
      # DEPLOY
      # ----------------------------------------------------------------------
      - name: Deploy Astro dist to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          rsync \
            -az \
            --exclude='*.map' \
            -e "ssh -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no -p $SSH_PORT" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$HOSTINGER_PATH"

      # ----------------------------------------------------------------------
      # POST-DEPLOYMENT VERIFICATION
      # ----------------------------------------------------------------------
      # Every other gate in this workflow inspects dist/. This one fetches what
      # a crawler fetches, so it catches the failures that happen between the
      # bundle and the browser: a rewrite that redirects a sitemap URL, a
      # missing .htaccess, a key file that 404s. It runs BEFORE IndexNow, so a
      # broken deployment is never advertised to Bing.
      - name: SEO smoke test against the live site
        run: npm run seo:smoke

      # Only the URLs that are new, changed or removed since the sitemap that
      # was live before this deploy. Skipped entirely when the secret is absent,
      # and never fails the deployment: the site is already up, and a rejected
      # ping is not a reason to mark a good release red.
      - name: Tell IndexNow what changed
        if: ${{ env.INDEXNOW_KEY != '' }}
        continue-on-error: true
        run: |
          if [ -s /tmp/live-sitemap.xml ]; then
            npm run indexnow -- --since /tmp/live-sitemap.xml
          else
            echo "No baseline was captured; skipping. Run 'npm run indexnow:all' manually for a first submission."
          fi
