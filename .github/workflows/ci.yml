name: CI

on:
  # Run CI/CD when code reaches the production branch.
  push:
    branches:
      - main

  # Validate pull requests before they are merged into main.
  pull_request:
    branches:
      - main

# This workflow only needs permission to read repository contents.
permissions:
  contents: read

# Cancel outdated CI runs when a newer commit is pushed to the same PR.
# Production/main runs are NOT cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================================================
  # BUILD AND TEST
  # ==========================================================================
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Keep the project's existing Node version for now.
          # Upgrading the application itself to Node 24 should be a separate change.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Assert generated embed pages are current
        run: npm run assert:embed-pages-current

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Assert public embeds stay isolated
        run: npm run assert:embed-isolation

      - name: Assert monetization stays off
        run: npm run assert:mon-off

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

  # ==========================================================================
  # DEPLOY TO HOSTINGER
  #
  # Deployment runs only:
  #   1. After build-and-test succeeds
  #   2. On a push to main
  #
  # Required GitHub repository secrets:
  #   HOSTINGER_HOST
  #   HOSTINGER_USER
  #   HOSTINGER_PORT
  #   HOSTINGER_PATH
  #   HOSTINGER_SSH_KEY
  # ==========================================================================
  deploy:
    needs: build-and-test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-24.04

    # Never allow two production deployments to run simultaneously.
    concurrency:
      group: hostinger-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      # Internal demo routes are useful during development/tests
      # but must never be deployed to production.
      - name: Strip internal /dev routes from the bundle
        run: rm -rf dist/dev

      - name: Assert no /dev output is about to ship
        run: npm run assert:no-dev

      - name: Assert .htaccess is in the bundle
        run: |
          test -f dist/.htaccess || \
          (echo "::error::dist/.htaccess missing - clean URLs would 404" && exit 1)

      # ----------------------------------------------------------------------
      # SSH CONFIGURATION
      # ----------------------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # ----------------------------------------------------------------------
      # VERIFY HOSTINGER CONNECTION
      # ----------------------------------------------------------------------
      - name: Verify Hostinger SSH connection
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o PasswordAuthentication=no \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "test -d '$HOSTINGER_PATH' && echo 'SSH connection and deployment path verified'"

      # ----------------------------------------------------------------------
      # DEPLOY
      # ----------------------------------------------------------------------
      - name: Deploy Astro dist to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          rsync \
            -az \
            --exclude='*.map' \
            -e "ssh -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no -p $SSH_PORT" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$HOSTINGER_PATH"
