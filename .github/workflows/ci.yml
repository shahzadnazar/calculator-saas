name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Assert monetization stays off (no region/landmark/reserved space/CSS/bridge JS on any live page)
        run: npm run assert:mon-off
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: npm run test:e2e

  # The internal /dev/ demo route is allowed on feature branches while building
  # the shared utility system, but must never reach production. Enforced on the
  # default branch only.
  prelaunch-no-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Assert no /dev/ output in production build
        run: npm run assert:no-dev
