name: CI

# This workflow used to be `on: push:` with no filter, so EVERY commit on EVERY
# branch ran the full ~20-minute suite. That is a private repository, where
# Actions minutes are metered, and it exhausted the monthly allowance: from
# 2026-09-29 the runner stopped starting jobs at all — 4-second "failures" with
# no logs and no steps, on commits that changed nothing but documentation.
#
# The suite is unchanged and still runs in full at both points that matter: on a
# pull request, before anything can merge, and on main, before anything deploys.
# What is gone is running it again for every intermediate commit on a branch
# nobody has proposed merging yet. A twelve-commit day used to cost four hours of
# runner time and now costs the one PR run plus the one main run.
on:
  # Production. Full suite, then deploy.
  push:
    branches: [main]
  # The gate before that. Re-runs on every push to the PR's branch, so the
  # signal you actually act on is unchanged.
  pull_request:
  # Any branch, on demand, when you want the full suite without opening a PR.
  workflow_dispatch:

# Workflow only needs read access to repository contents.
permissions:
  contents: read

# If several commits are pushed quickly to the same pull request,
# cancel the older CI run and test only the newest commit.
#
# Never cancel a main/production workflow once it has started.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ==========================================================================
  # BUILD AND TEST
  #
  # Runs on every pull request, on every push to main, and on demand.
  # ==========================================================================
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Keep the application's existing Node.js version for now.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Assert generated embed pages are current
        run: npm run assert:embed-pages-current

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Assert public embeds stay isolated
        run: npm run assert:embed-isolation

      - name: Assert monetization stays off
        run: npm run assert:mon-off

      # The domain was registered before we owned it, and Google still held the
      # previous owner's WordPress site: /home/ indexed with no description,
      # blocked by a robots.txt that stopped the crawler ever seeing the 301
      # waiting for it. Every cause was visible in dist/ and nothing was looking.
      - name: Assert the bundle is indexable
        run: npm run assert:indexable

      # The browser is ~130 MB and identical between runs; only its apt
      # dependencies have to be laid down each time. Keyed on the resolved
      # Playwright version, so a version bump invalidates the cache by itself
      # rather than serving a browser the test runner refuses to drive.
      - name: Resolve the Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not the system libraries it links
      # against, which live outside the cached directory.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

  # ==========================================================================
  # DEPLOY TO HOSTINGER
  #
  # Runs ONLY when:
  #   1. build-and-test succeeds
  #   2. the push is on main
  #
  # Required repository secrets:
  #   HOSTINGER_HOST
  #   HOSTINGER_USER
  #   HOSTINGER_PORT
  #   HOSTINGER_PATH
  #   HOSTINGER_SSH_KEY
  # ==========================================================================
  deploy:
    needs: build-and-test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-24.04

    # Only one production deployment can run at a time.
    concurrency:
      group: hostinger-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      # Internal demo routes are used during development/tests,
      # but must never reach production.
      - name: Strip internal /dev routes from the bundle
        run: rm -rf dist/dev

      - name: Assert no /dev output is about to ship
        run: npm run assert:no-dev

      # Re-run on the exact bundle about to be uploaded, not just the one CI
      # built. This supersedes the bare `test -f dist/.htaccess` that used to sit
      # here: it still fails when the file is missing, and also when the file is
      # present but has lost the /home redirect or the DirectoryIndex pin, when
      # robots.txt blocks a path .htaccess redirects, or when the home page has
      # lost its canonical or description.
      - name: Assert the bundle is indexable
        run: npm run assert:indexable

      # ----------------------------------------------------------------------
      # SSH CONFIGURATION
      # ----------------------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # ----------------------------------------------------------------------
      # VERIFY HOSTINGER CONNECTION
      # ----------------------------------------------------------------------
      - name: Verify Hostinger SSH connection
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o PasswordAuthentication=no \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "test -d '$HOSTINGER_PATH' && echo 'SSH connection and deployment path verified'"

      # ----------------------------------------------------------------------
      # DEPLOY
      # ----------------------------------------------------------------------
      - name: Deploy Astro dist to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          rsync \
            -az \
            --exclude='*.map' \
            -e "ssh -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no -p $SSH_PORT" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$HOSTINGER_PATH"
